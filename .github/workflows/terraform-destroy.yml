name: Terraform destroy

on:
  workflow_dispatch:
    inputs:
      confirmation: { description: "Type DESTROY BEDROCK PILOT", required: true, type: string }

permissions: { contents: read }
concurrency: { group: terraform-pilot, cancel-in-progress: false }

jobs:
  destroy:
    if: ${{ inputs.confirmation == 'DESTROY BEDROCK PILOT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pilot
    permissions: { contents: read, id-token: write }
    env:
      TF_INPUT: "false"
      TF_VAR_budget_notification_email: ${{ secrets.BUDGET_NOTIFICATION_EMAIL }}
      TF_VAR_trusted_workload_role_arns: ${{ vars.TRUSTED_WORKLOAD_ROLE_ARNS_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: 1.15.8 }
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
      - run: terraform -chdir=infra/environments/pilot-iam init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" && terraform -chdir=infra/environments/pilot-iam destroy -input=false -auto-approve -var="aws_account_id=${{ vars.AWS_ACCOUNT_ID }}" -var="state_bucket_name=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform -chdir=infra/environments/pilot-bedrock init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" && terraform -chdir=infra/environments/pilot-bedrock destroy -input=false -auto-approve -var="aws_account_id=${{ vars.AWS_ACCOUNT_ID }}"
