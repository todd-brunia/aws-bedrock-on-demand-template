name: Terraform validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: 1.15.8 }
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false && terraform -chdir=infra/bootstrap validate
      - run: terraform -chdir=infra/environments/pilot-bedrock init -backend=false -input=false && terraform -chdir=infra/environments/pilot-bedrock validate
      - run: terraform -chdir=infra/environments/pilot-iam init -backend=false -input=false && terraform -chdir=infra/environments/pilot-iam validate
      - run: test ! -f opencode.json && ! rg -n 'AWS_(ACCESS_KEY_ID|SECRET_ACCESS_KEY|BEARER_TOKEN_BEDROCK)=' .
