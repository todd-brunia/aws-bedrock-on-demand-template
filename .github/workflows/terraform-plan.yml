name: Terraform remote plan

on:
  pull_request:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform-*.yml"]
  workflow_dispatch:

permissions: { contents: read }

jobs:
  plan-bedrock:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.AWS_ACCOUNT_ID != '' && vars.AWS_TERRAFORM_PLAN_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' }}
    runs-on: ubuntu-latest
    environment: pilot-plan
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: 1.15.8 }
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
      - run: terraform -chdir=infra/environments/pilot-bedrock init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform -chdir=infra/environments/pilot-bedrock plan -input=false -var="aws_account_id=${{ vars.AWS_ACCOUNT_ID }}" -var="budget_notification_email=plan@example.invalid"
